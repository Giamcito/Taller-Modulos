<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Número de Orden</th>
        <th>Cliente</th>
        <th>Total</th>
        <th>Fecha</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let orden of ordenes">
        <td>{{ orden.id }}</td>
        <td>{{ orden.orderNumber }}</td>
        <td>{{ orden.customerName }}</td>
        <td>${{ orden.total | number }}</td>
        <td>{{ orden.date }}</td>
        <td>
          <span [ngClass]="getStatusClass(orden.status)" class="badge">
            {{ orden.status | uppercase }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
